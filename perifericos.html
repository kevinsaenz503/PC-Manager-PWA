<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Periféricos</title>

<link rel="stylesheet" href="./css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./img/icon-192.png">
<script src="./js/app.js" defer></script>
    
</head>

<body>

<div class="container">

<aside class="sidebar">

<h2>💻 PC Manager</h2>

<ul>

<li><a href="./">🏠 Dashboard</a></li>
<li><a href="./computadoras">💻 Computadoras</a></li>
<li><a href="./usuarios">👤 Usuarios</a></li>
<li><a href="./prestamos">📦 Préstamos</a></li>
<li><a href="./mantenimiento">🔧 Mantenimiento</a></li>
<li><a class="activo" href="./perifericos">🖨️ Periféricos</a></li>
<li><a href="./reportes">📊 Reportes</a></li>
<li><a href="./configuracion">⚙ Configuración</a></li>

</ul>

</aside>

<main class="contenido">
    <div class="header">

    <div>

        <h1>PC Manager</h1>

        <span>Sistema de Gestión Informática</span>

    </div>

    <div class="acciones-header">

        <button id="modoOscuro">

            <i class="fa-solid fa-moon"></i>

        </button>

        <span>

            <i class="fa-solid fa-user-shield"></i>

            Administrador

        </span>

    </div>

</div>

<h1>🖨️ Gestión de Periféricos</h1>

<div class="barra-superior">

<input
type="text"
id="buscar"
placeholder="Buscar periférico...">

</div>

<form id="formPeriferico">

<input
type="text"
id="codigo"
placeholder="Código"
required>

<select id="tipo">

<option>Monitor</option>
<option>Teclado</option>
<option>Mouse</option>
<option>Impresora</option>
<option>Audífonos</option>
<option>Webcam</option>
<option>Bocinas</option>
<option>Disco Externo</option>
<option>USB</option>

</select>

<input
type="text"
id="marca"
placeholder="Marca"
required>

<input
type="text"
id="modelo"
placeholder="Modelo">

<input
type="text"
id="serie"
placeholder="Número de serie">

<select id="estado">

<option>Disponible</option>
<option>Asignado</option>
<option>Mantenimiento</option>

</select>

<input
type="text"
id="ubicacion"
placeholder="Ubicación">

<button type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Guardar

</button>

</form>

<table>

<thead>

<tr>

<th>Código</th>
<th>Tipo</th>
<th>Marca</th>
<th>Modelo</th>
<th>Serie</th>
<th>Estado</th>
<th>Ubicación</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaPerifericos">

</tbody>

</table>

</main>

</div>

<script src="./js/perifericos.js"></script>

    <script>

if("serviceWorker" in navigator){

    window.addEventListener("load",()=>{

        navigator.serviceWorker.register("./sw.js")

        .then(()=>{

            console.log("✅ Service Worker registrado");

        })

        .catch(error=>{

            console.error("Error:",error);

        });

    });

}

</script>

</body>
</html>
