<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Préstamos</title>

<link rel="stylesheet" href="./css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<aside class="sidebar">

<h2>💻 PC Manager</h2>

<ul>

<li><a href="./">🏠 Dashboard</a></li>
<li><a href="./computadoras">💻 Computadoras</a></li>
<li><a href="./usuarios">👤 Usuarios</a></li>
<li><a class="activo" href="./prestamos">📦 Préstamos</a></li>
<li><a href="./mantenimiento">🔧 Mantenimiento</a></li>
<li><a href="./perifericos">🖨️ Periféricos</a></li>
<li><a href="./reportes">📊 Reportes</a></li>
<li><a href="./configuracion">⚙ Configuración</a></li>

</ul>

</aside>

<main class="contenido">
    
    <div class="header">

    <div>

        <h1>PC Manager</h1>

        <span>Sistema de Gestión Informática</span>

    </div>

    <div class="acciones-header">

        <button id="modoOscuro">

            <i class="fa-solid fa-moon"></i>

        </button>

        <span>

            <i class="fa-solid fa-user-shield"></i>

            Administrador

        </span>

    </div>

</div>

<h1>📦 Gestión de Préstamos</h1>



<form id="formPrestamo">

<select id="pc" required></select>

<select id="usuario" required></select>

<input type="date" id="fechaPrestamo" required>

<input type="date" id="fechaDevolucion" required>

<input type="text"
id="observacion"
placeholder="Observaciones">

<button type="submit">

<i class="fa-solid fa-floppy-disk"></i>

Registrar

</button>

</form>

<table>

<thead>

<tr>

<th>Computadora</th>

<th>Usuario</th>

<th>Préstamo</th>

<th>Devolución</th>

<th>Observación</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaPrestamos">

</tbody>

</table>

</main>

</div>

<script src="./js/prestamos.js"></script>

</body>
</html>
