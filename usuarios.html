<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuarios</title>

<link rel="stylesheet" href="./css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

<aside class="sidebar">

<h2>💻 PC Manager</h2>

<ul>

<li><a href="./">🏠 Dashboard</a></li>

<li><a href="./computadoras">💻 Computadoras</a></li>

<li><a class="activo" href="./usuarios">👤 Usuarios</a></li>

<li><a href="./prestamos">📦 Préstamos</a></li>

<li><a href="./mantenimiento">🔧 Mantenimiento</a></li>

<li><a href="./perifericos">🖨️ Periféricos</a></li>

<li><a href="./reportes">📊 Reportes</a></li>

<li><a href="./configuracion">⚙ Configuración</a></li>

</ul>

</aside>

<main class="contenido">
    <div class="header">

    <div>

        <h1>PC Manager</h1>

        <span>Sistema de Gestión Informática</span>

    </div>

    <div class="acciones-header">

        <button id="modoOscuro">

            <i class="fa-solid fa-moon"></i>

        </button>

        <span>

            <i class="fa-solid fa-user-shield"></i>

            Administrador

        </span>

    </div>

</div>

<h1>👤 Gestión de Usuarios</h1>

<div class="barra-superior">

<input
type="text"
id="buscar"
placeholder="Buscar usuario...">

</div>

<form id="formUsuario">

<input
type="text"
id="codigo"
placeholder="Código"
required>

<input
type="text"
id="nombre"
placeholder="Nombre completo"
required>

<input
type="text"
id="cargo"
placeholder="Cargo">

<input
type="text"
id="departamento"
placeholder="Departamento">

<input
type="email"
id="correo"
placeholder="Correo">

<input
type="text"
id="telefono"
placeholder="Teléfono">

<button type="submit">

<i class="fa-solid fa-user-plus"></i>

Guardar Usuario

</button>

</form>

<table>

<thead>

<tr>

<th>Código</th>

<th>Nombre</th>

<th>Cargo</th>

<th>Departamento</th>

<th>Correo</th>

<th>Teléfono</th>

<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaUsuarios">

</tbody>

</table>

</main>

</div>

<script src="./js/usuarios.js"></script>

</body>

</html>
